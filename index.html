<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link
    rel="stylesheet"
    href="style.css"
    media="screen"
    charset="utf-8">
</head>
<body>
  <header class="header">
    <img src="./eisenhower-matrix.jpg" alt="eisenhower-matrix" class="header__image">
    <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>
  <main class="todo">
    <section id="todo__new-task">
      <label for="new-task" class="todo__label">Add Item</label>
      <div class="todo__row">
        <input
          id="new-task"
          class="todo__input"
          type="text">
        <button class="todo__add-button">Add</button>
      </div>
    </section>
    <section>
      <h3 class="todo__heading">Todo</h3>
      <ul id="incomplete-tasks" class="todo__list">
        <li class="todo__item">
          <input type="checkbox" class="todo__checkbox">
          <label class="todo__text">Pay Bills</label>
          <input type="text" class="todo__input">
          <button class="todo__edit-button">Edit</button>
          <button class="todo__delete-button">
            <img src="./remove.svg" alt="remove-icon" class="todo__icon">
          </button>
        </li>
        <li class="todo__item todo__item--editing">
          <input type="checkbox" class="todo__checkbox">
          <label class="todo__text">Go Shopping</label>
          <input
            type="text"
            value="Go Shopping"
            class="todo__input">
          <button class="todo__edit-button">Save</button>
          <button class="todo__delete-button">
            <img src="./remove.svg" alt="remove-icon" class="todo__icon">
          </button>
        </li>
      </ul>
    </section>
    <section>
      <h3 class="todo__heading">Completed</h3>
      <ul id="completed-tasks" class="todo__list">
        <li class="todo__item todo__item--completed">
          <input type="checkbox" class="todo__checkbox" checked>
          <label class="todo__text">See the Doctor</label>
          <input type="text" class="todo__input">
          <button class="todo__edit-button">Edit</button>
          <button class="todo__delete-button">
            <img src="./remove.svg" alt="remove-icon" class="todo__icon">
          </button>
        </li>
      </ul>
    </section>

</main>
  <script src="app.js"></script>
</body>
</html>
